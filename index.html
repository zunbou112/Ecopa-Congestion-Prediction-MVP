<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>エコパ周辺 混雑予測</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>エコパ周辺 混雑予測</h1>
        </header>
        
        <main>
            <div class="prediction-card">
                <div class="date-display" id="dateDisplay"></div>
                
                <div class="delay-section">
                    <div class="delay-label">予想遅延時間</div>
                    <div class="delay-time" id="delayTime"></div>
                </div>
                
                <div class="reason-section">
                    <div class="reason-label">理由</div>
                    <div class="reason-text" id="reasonText"></div>
                </div>
            </div>
            
            <div class="map-card">
                <h2 class="section-title">エコパ周辺地図</h2>
                <div class="google-map-container">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3266.8947896847!2d138.0547!3d34.7547!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6019a1b8e1b8e1b8%3A0x1b8e1b8e1b8e1b8e!2z44Ko44Kz44OR44Ki44Oq44O844OK!5e0!3m2!1sja!2sjp!4v1234567890123!5m2!1sja!2sjp"
                        width="100%" 
                        height="300" 
                        style="border:0; border-radius: 12px;" 
                        allowfullscreen="" 
                        loading="lazy" 
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>
            
            <div class="map-card">
                <h2 class="section-title">混雑マップ</h2>
                <div class="map-container" id="mapContainer">
                    <div class="map-legend">
                        <div class="legend-item">
                            <span class="legend-color low"></span>
                            <span class="legend-text">空いている</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-color medium"></span>
                            <span class="legend-text">やや混雑</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-color high"></span>
                            <span class="legend-text">混雑</span>
                        </div>
                    </div>
                    <div class="map-visual" id="mapVisual"></div>
                </div>
            </div>
            
            <div class="routes-card">
                <h2 class="section-title">おすすめ代替ルート</h2>
                <div class="routes-container" id="routesContainer"></div>
            </div>
        </main>
        
        <footer>
            <p>静岡理工科大学 提供</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
